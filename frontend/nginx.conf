server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # ============================================
    # БЛОКИРОВКА ВРЕДОНОСНЫХ БОТОВ
    # ============================================
    # Проверяем User-Agent и блокируем известных ботов
    if ($http_user_agent ~* "(OAI-SearchBot|GPTBot|ClaudeBot|Claude-User|Claude-SearchBot|Bytespider|Perplexity|GrokBot|ChatGPT-User|Discordbot|TelegramBot|WhatsApp|LinkedInBot|Amazonbot|Amzn-SearchBot|Slackbot|facebookexternalhit|meta-externalagent|Applebot|Twitterbot|Google-Extended)") {
        return 403;
    }

    # ============================================
    # БЛОКИРОВКА IP АТАКУЮЩЕГО (временная мера)
    # ============================================
    # Блокируем IP, с которого идёт сканирование
    if ($remote_addr = "34.13.209.163") {
        return 403;
    }
    # Можно также блокировать целые подсети Google Cloud, если атаки продолжаются:
    # if ($remote_addr ~* "^34\.13\.") {
    #     return 403;
    # }

    # ============================================
    # ЗАПРЕТ ДОСТУПА К СКРЫТЫМ ФАЙЛАМ
    # ============================================
    # Запрет на доступ к скрытым файлам (.env, .git и т.п.)
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
    }

    # ============================================
    # ЗАПРЕТ ДОСТУПА К ЧУВСТВИТЕЛЬНЫМ ФАЙЛАМ
    # ============================================
    # Файлы окружения и конфигурации
    location ~* ^/(\.env|\.env\..*|config\.env|application\.env|secrets\.env|\.aws|\.ssh|\.config|\.docker|\.vscode|\.kube|\.gcloud|\.gcp|\.local|\.hermes|\.openai|\.anthropic|\.streamlit|\.sentry|\.continue|\.codex|\.claude|\.pypirc|\.netrc|\.bashrc|\.bash_profile|\.zshrc|\.profile|\.bash_history) {
        return 404;
    }

    # Файлы с учётными данными
    location ~* ^/(credentials|credentials\.json|service-account\.json|serviceAccountKey\.json|gcp-credentials\.json|google-credentials\.json|application_default_credentials\.json|aws_credentials|aws_creds|firebase-credentials\.json|firebase-service-account\.json|firebase-adminsdk\.json|keyfile\.json|key\.json|gcp-key\.json|sa\.json|rclone\.conf|s3cfg|boto) {
        return 404;
    }

    # Terraform / K8s / DevOps файлы
    location ~* ^/(terraform\.tfstate|terraform\.tfvars\.json|terraform\.tfvars|secrets\.tfvars|secrets\.auto\.tfvars|cdk\.context\.json|cdk\.json|k8s/|kubernetes\.yml|values\.yaml|vault\.yml|helm/|charts/) {
        return 404;
    }

    # Конфигурационные файлы приложений
    location ~* ^/(config\.json|settings\.json|appsettings\.json|application\.yml|application\.properties|application-.*\.yml|application-.*\.properties|config/|buildspec\.yml|appspec\.yaml|appspec\.yml|ecosystem\.config\.js|sftp-config\.json|amplifyconfiguration\.json|gradle\.properties|docker-compose\.ya?ml|serverless\.ya?ml|compose\.ya?ml|openapi\.json|swagger\.json|push_config\.json) {
        return 404;
    }

    # SSH-ключи и сертификаты
    location ~* ^/(id_rsa|id_ecdsa|id_dsa|id_ed25519|key\.pem|server\.key|private-key|privatekey\.key|localhost\.key|host\.key|ssl/.*\.key|\.ssh/|master\.key|credentials\.yml\.enc) {
        return 404;
    }

    # PHP-инфо и дебаг-инструменты
    location ~* ^/(phpinfo\.php|info\.php|pi\.php|_profiler|_debugbar|__debug__|debug/|trace\.axd|elmah\.axd|elmah|actuator|actuator/|horizon/|telescope/|_ignition/|__clockwork|server-status|server-info|nginx_status) {
        return 404;
    }

    # Файлы бэкапов, логов и SQL-дампы
    location ~* \.(bak|backup|old|orig|copy|save|tmp|swp|~|log|sql|sql\.gz|sql\.zip)$ {
        return 404;
    }

    # Лог-файлы
    location ~* ^/(logs/|log/|storage/logs/|error\.log|app\.log|access\.log|error_log) {
        return 404;
    }

    # Бэкапы БД
    location ~* ^/(backup\.sql|dump\.sql|database\.sql|db\.sql) {
        return 404;
    }

    # ============================================
    # ЗАПРЕТ ДОСТУПА К КОНФИДЕНЦИАЛЬНЫМ ПУТЯМ
    # ============================================
    location ~* ^/(admin|api|config|internal|private|secret|keys|certs|ssl|deploy|infra|infrastructure|terraform|cdk|aws|gcp|gcloud|firebase|k8s|helm|docker|services|app_dev\.php|app_dev\.php/) {
        return 404;
    }

    # ============================================
    # ЗАЩИТНЫЕ ЗАГОЛОВКИ
    # ============================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://api.*; frame-ancestors 'none';" always;

    # ============================================
    # ОПТИМИЗАЦИЯ GZIP
    # ============================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ============================================
    # ОСНОВНОЕ ПРАВИЛО ДЛЯ SPA
    # ============================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ============================================
    # ЗАПРЕТ ДОСТУПА К SOURCEMAP
    # ============================================
    location ~* \.(map)$ {
        return 404;
    }
}