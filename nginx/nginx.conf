# nginx/nginx.conf для AutoParts (Django + React + WebSocket)
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    server_tokens off;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    upstream backend {
        server backend:8000;
    }
    
    upstream frontend {
        server frontend;
    }
    
    upstream websocket {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        # Блокируем доступ к скрытым файлам (.env, .git и т.п.)
        location ~ /\.(?!well-known) {
            deny all;
            return 404;
        }

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # HSTS имеет смысл только при реальном HTTPS-терминировании. Не выставляем на 80 порту.

        # API -> backend
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300;
        }

        # Не отдаём sourcemap'ы наружу (меньше утечек и нагрузка ниже)
        location ~* \.(map)$ {
            return 404;
        }

        # WebSocket
        location /ws/ {
            proxy_pass http://websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
        }

        # Интерфейс управления прокси
        location /proxy-manager {
            alias /app/frontend/proxy-manager.html;
            add_header Content-Type text/html;
        }

        # Медиа только через API с токеном — прямой доступ закрыт
        location /media/ {
            deny all;
            return 403;
        }

        # Frontend requests
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}