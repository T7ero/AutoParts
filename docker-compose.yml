services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: autoparts
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autoparts"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile.alternative
    command: daphne -b 0.0.0.0 -p 8000 backend.asgi:application
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
      - ./backend/static:/app/static
    env_file:
      - ./secret.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DJANGO_SETTINGS_MODULE=backend.settings
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgres://postgres:postgres@db:5432/autoparts
      - ALLOWED_HOSTS=87.228.101.164,localhost,127.0.0.1,backend,172.17.0.98
      - CORS_ALLOWED_ORIGINS=http://87.228.101.164,http://localhost:3000,http://127.0.0.1:3000
      # Если нужно принудительно переустановить пароль admin из secret.env:
      # - FORCE_ADMIN_PASSWORD=1
      - POSTGRES_DB=autoparts
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DEBUG=False
      - PYTHONUNBUFFERED=1
    restart: always
    deploy:
      resources:
        limits:
          memory: 4096M
          cpus: '2.0'
        reservations:
          memory: 2048M
          cpus: '1.0'

  celery:
    build: 
      context: ./backend
      dockerfile: Dockerfile.alternative
    command: celery -A backend worker -l info --concurrency=2 --max-tasks-per-child=5 --prefetch-multiplier=1
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
    env_file:
      - ./secret.env
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      - DJANGO_SETTINGS_MODULE=backend.settings
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgres://postgres:postgres@db:5432/autoparts
      - ALLOWED_HOSTS=87.228.101.164,localhost,127.0.0.1,backend,172.17.0.98
      - CORS_ALLOWED_ORIGINS=http://87.228.101.164,http://localhost:3000,http://127.0.0.1:3000
      # Если нужно принудительно переустановить пароль admin из secret.env:
      # - FORCE_ADMIN_PASSWORD=1
      - POSTGRES_DB=autoparts
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DISPLAY=:99
      - CHROME_HEADLESS=1
      - CHROME_NO_SANDBOX=1
      - CHROME_DISABLE_DEV_SHM=1
      - CHROME_USER_DATA_DIR=/tmp/chrome
      - CHROME_REMOTE_DEBUGGING_PORT=0
      - DEBUG=False
      - PYTHONUNBUFFERED=1
      - CHROME_MAX_PROCESSES=10
      - ARMTEK_CLEANUP_INTERVAL=3
      - SELENIUM_TIMEOUT=15
      - PAGE_LOAD_TIMEOUT=20
      - EMEX_USE_PROXY=1
    restart: always
    deploy:
      resources:
        limits:
          memory: 8192M
          cpus: '2.0'
        reservations:
          memory: 4096M
          cpus: '2.0'
    shm_size: '4gb'
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.alternative
    command: celery -A backend beat -l info --pidfile=/app/media/temp/celerybeat.pid
    volumes:
      - ./backend:/app
      - ./backend/media:/app/media
    env_file:
      - ./secret.env
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      - DJANGO_SETTINGS_MODULE=backend.settings
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SKIP_XVFB=1
      - DEBUG=False
      - PYTHONUNBUFFERED=1
    restart: always

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    restart: always

  nginx:
    image: nginx:1.25
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backend/static:/static
      - ./backend/media:/media
      - ./frontend/proxy-manager.html:/app/frontend/proxy-manager.html:ro
      # - ./nginx/certs:/etc/nginx/certs:ro  # если нужен HTTPS
    depends_on:
      - backend
      - frontend
    restart: always